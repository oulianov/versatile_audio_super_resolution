[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audiosr"
version = "0.0.7"
description = "This package is written for text-to-audio/music generation."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch>=2.0.1",
    "torchaudio>=2.0.2",
    "torchvision>=0.15.2",
    "tqdm",
    "gradio",
    "pyyaml",
    "einops",
    "chardet",
    "numpy",
    "soundfile",
    "scipy",
    "pandas",
    "unidecode",
    "phonemizer",
    "transformers>=4.30.2",
    "huggingface_hub",
    "progressbar",
    "ftfy",
    "timm",
    "matplotlib",
    "diffusers>=0.38.0,<0.40.0",
    "pyinstrument>=5.1.2",
]


[dependency-groups]
dev = ["ruff>=0.1.0", "ty>=0.0.1", "pytest", "librosa"]

[project.optional-dependencies]
clap = ["librosa", "torchlibrosa>=0.0.9"]
dev = ["ruff>=0.1.0", "ty>=0.0.1", "pytest", "librosa"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "F401", "F841"]
